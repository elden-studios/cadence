have_fun: false

code_review:
  disable: false
  # LOW surfaces every issue Gemini notices, not just MEDIUM+ severity.
  comment_severity_threshold: LOW
  # -1 = unlimited inline comments per PR.
  max_review_comments: -1
  pull_request_opened:
    help: false
    summary: true
    code_review: true
    include_drafts: true

# Keep the reviewer focused on hand-written code, not generated/build output.
ignore_patterns:
  - "build/**"
  - "Billable.xcodeproj/**"
  - "**/*.pbxproj"
  - "**/*.xcassets/**"
