name: Billable
options:
  bundleIdPrefix: com.eldenstudios
  developmentLanguage: en
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  groupSortPosition: top
  generateEmptyDirectories: true
  createIntermediateGroups: true
  xcodeVersion: "16.0"
  defaultConfig: Debug

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GCC_PREPROCESSOR_DEFINITIONS:
      - DEBUG=1
      - $(inherited)
    OTHER_SWIFT_FLAGS: $(inherited) -enable-upcoming-feature ExistentialAny
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
  configs:
    Release:
      GCC_PREPROCESSOR_DEFINITIONS:
        - $(inherited)

packages:
  BillableCore:
    path: Packages/BillableCore

schemes:
  Billable:
    build:
      targets:
        Billable: all
        BillableWidgets: all
    run:
      config: Debug
      storeKitConfiguration: App/Resources/Billable.storekit
    test:
      config: Debug
      targets:
        - Billable
        - BillableUITests
    archive:
      config: Release
    profile:
      config: Release
    analyze:
      config: Debug

targets:
  Billable:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App/Sources
      - path: App/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.eldenstudios.billable
        PRODUCT_NAME: Billable
        INFOPLIST_KEY_CFBundleDisplayName: Cadence
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: NO
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_PREVIEWS: YES
        CODE_SIGN_ENTITLEMENTS: App/Resources/Billable.entitlements
    dependencies:
      - package: BillableCore
        product: BillableCore
      - target: BillableWidgets

  BillableWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Widgets/Sources
      - path: Widgets/Resources
        excludes:
          - "Info.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.eldenstudios.billable.widgets
        PRODUCT_NAME: BillableWidgets
        INFOPLIST_FILE: Widgets/Resources/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        CODE_SIGN_ENTITLEMENTS: Widgets/Resources/BillableWidgets.entitlements
    dependencies:
      - package: BillableCore
        product: BillableCore

  BillableUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App/BillableUITests
    dependencies:
      - target: Billable
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.eldenstudios.billable.uitests
        TEST_TARGET_NAME: Billable
        GENERATE_INFOPLIST_FILE: YES
